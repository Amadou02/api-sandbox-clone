name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: check out Git repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm ci
      - name: Lint and format code
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          prettier: true
